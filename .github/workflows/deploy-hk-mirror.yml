name: Deploy HK mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hk-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check HK deploy secrets
        id: check
        env:
          HOST: ${{ secrets.HK_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HK_SSH_HOST not set — skip HK deploy"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HK_SSH_HOST }}
          username: ${{ secrets.HK_SSH_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HK_APP_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
